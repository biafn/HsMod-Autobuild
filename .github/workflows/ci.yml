name: Sync Upstream HsMod

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟检查一次
  workflow_dispatch:        # 允许手动点 Run
  repository_dispatch:      # 以后可高级触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set git identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions@users.noreply.github.com"

    - name: Add upstream
      run: |
        git remote add upstream https://github.com/Pik-4/HsMod.git || true

    - name: Fetch upstream
      run: git fetch upstream

    - name: Sync bepinex5
      run: |
        git checkout bepinex5
        git merge upstream/bepinex5 --no-edit || exit 0

    - name: Push changes
      run: git push origin bepinex5
